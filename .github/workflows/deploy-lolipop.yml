name: Final migration to Lolipop (manual only)

# FUTURE FINAL-PRODUCTION WORKFLOW.
# During active development, GitHub Pages is the preview environment.
# Run this workflow only after the user explicitly declares 50PLUS complete
# and chooses to migrate final production to Lolipop.
# It intentionally does NOT use mirror --delete.

on:
  workflow_dispatch:
    inputs:
      confirm_final_migration:
        description: 'Type FINAL only when 50PLUS is complete and ready for Lolipop production migration'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-50plus-lolipop-final
  cancel-in-progress: false

jobs:
  deploy:
    name: Final FTPS deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit final-migration confirmation
        env:
          CONFIRM: ${{ inputs.confirm_final_migration }}
        run: |
          if [ "$CONFIRM" != "FINAL" ]; then
            echo '::error::Final Lolipop migration is blocked. Type FINAL only after the user explicitly declares the site complete.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production artifact
        run: |
          set -euo pipefail
          rm -rf _release
          mkdir -p _release
          cp index.html activities.html listings.html guides.html about.html contact.html 404.html robots.txt sitemap.xml _release/
          cp -R assets _release/assets
          touch _release/.nojekyll
          echo 'Prepared runtime-only final production artifact.'

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.LOLIPOP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.LOLIPOP_FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo '::error::LOLIPOP_FTP_SERVER is not configured.'; exit 1; }
          test -n "$FTP_USERNAME" || { echo '::error::LOLIPOP_FTP_USERNAME is not configured.'; exit 1; }
          test -n "$FTP_PASSWORD" || { echo '::error::LOLIPOP_FTP_PASSWORD is not configured.'; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo '::error::LOLIPOP_FTP_SERVER_DIR is not configured.'; exit 1; }
          if [ "$FTP_SERVER" != "ftp.lolipop.jp" ]; then
            echo '::error::LOLIPOP_FTP_SERVER must be ftp.lolipop.jp.'
            exit 1
          fi
          case "$FTP_SERVER_DIR" in
            /|""|.)
              echo '::error::Refusing to deploy to an empty or root directory.'
              exit 1
              ;;
          esac
          echo 'Final deployment configuration passed non-secret validation.'

      - name: Deploy production artifact without remote deletion
        env:
          FTP_SERVER: ${{ secrets.LOLIPOP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.LOLIPOP_FTP_SERVER_DIR }}
        run: |
          cd _release
          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse --verbose=1 ./ "$FTP_SERVER_DIR"
          bye
          LFTP_EOF
