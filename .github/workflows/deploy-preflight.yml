name: Future Lolipop Final-Migration Preflight

# FUTURE FINAL-PRODUCTION PREFLIGHT.
# Do not use this as a blocker during GitHub Pages development.
# Run only when the user has declared the site complete and is preparing the
# final migration to https://50plus.rss7.net on Lolipop.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check future Lolipop deployment configuration without exposing values
        env:
          FTP_SERVER: ${{ secrets.LOLIPOP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.LOLIPOP_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required future Lolipop setting is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "$FTP_SERVER" != "ftp.lolipop.jp" ]; then
            echo '::error::Future LOLIPOP_FTP_SERVER must be ftp.lolipop.jp.'
            exit 1
          fi

          case "$FTP_SERVER_DIR" in
            /|""|.)
              echo '::error::Future Lolipop server directory must be a dedicated non-root directory.'
              exit 1
              ;;
          esac

          echo 'Future final-migration secret presence and non-secret constraints passed.'
          echo 'Secret values were not printed.'
