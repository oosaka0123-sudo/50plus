name: Lolipop FTPS Connection Test

on:
  push:
    branches:
      - test/lolipop-ftps-connection-20260906

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Validate secrets and test FTPS login only
        env:
          FTP_SERVER: ${{ secrets.LOLIPOP_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.LOLIPOP_FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Lolipop FTP secret is missing (${name})."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [ "$FTP_SERVER" != "ftp.lolipop.jp" ]; then
            echo "::error::Configured FTPS host is not ftp.lolipop.jp."
            exit 1
          fi

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd "$FTP_SERVER_DIR"
          pwd
          cls -1 | head -n 5
          bye
          LFTP_EOF

          echo "Lolipop FTPS authentication and read-only directory access succeeded."
          echo "No upload, delete, mirror, rename, mkdir, or file modification was performed."
