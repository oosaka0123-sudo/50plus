name: Lolipop FTPS Connection Test

on:
  push:
    branches:
      - test/lolipop-ftps-connection-20260906

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Validate config and test FTPS login only
        env:
          FTP_SERVER: ${{ vars.LOLIPOP_FTP_SERVER }}
          FTP_SERVER_DIR: ${{ vars.LOLIPOP_FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.LOLIPOP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_SERVER_DIR FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Lolipop FTP configuration is missing (${name})."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          if [ "$FTP_SERVER" != "ftp.lolipop.jp" ]; then
            echo "::error::Configured FTPS host is not ftp.lolipop.jp."
            exit 1
          fi

          case "$FTP_SERVER_DIR" in
            /|""|.)
              echo "::error::Configured FTP server directory is unsafe."
              exit 1
              ;;
          esac

          lftp <<LFTP_EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cd "$FTP_SERVER_DIR"
          pwd
          cls -1 | head -n 5
          bye
          LFTP_EOF

          echo "Lolipop FTPS authentication and read-only directory access succeeded."
          echo "No upload, delete, mirror, rename, mkdir, or file modification was performed."
