name: Claude Code Issue Task

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Claude authentication
        id: auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "mode=oauth_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Claude authentication is not configured. Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in repository Actions secrets."
          exit 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are working on GitHub Issue #${{ github.event.issue.number }} in repository ${{ github.repository }}.

            Read the current repository files and Issue body before acting. GitHub is the SSOT.

            GLOBAL TASK MODE RULE:
            - If the Issue explicitly says `ANALYSIS ONLY`, `no repository changes`, `do not create a Branch/Commit/Pull Request`, or equivalent, that instruction takes precedence over the implementation defaults below.
            - In ANALYSIS-ONLY MODE: read repository evidence as needed, do not create or modify files, branches, commits, or pull requests, and return the requested analysis only in the Issue conversation.
            - Otherwise use IMPLEMENTATION MODE.

            COMMON SAFETY RULES:
            - Stay within the target Issue scope.
            - If blocked, report OBSERVED / EVIDENCE / NEXT on the Issue instead of inventing success.
            - Do not trigger final Lolipop migration and do not change GitHub Secrets, credentials, IAM, billing, repository visibility, or other irreversible settings.
            - During active development, GitHub Pages is the public preview environment; final Lolipop production migration happens only after explicit user direction that the site is complete.
            - Do not fabricate real venues, events, schedules, participant demographics, gender ratios, ages, ratings, prices, attendance, or reviews.
            - Preserve the 50PLUS adult friendship/community product boundary and accessibility rules.
            - Follow repository handoff/context rules for long sessions.

            IMPLEMENTATION MODE only:
            - Use one dedicated branch for this Issue. Never commit directly to main.
            - Run relevant checks.
            - Open or update a Pull Request with a clear summary and evidence.
            - Do not auto-merge.
