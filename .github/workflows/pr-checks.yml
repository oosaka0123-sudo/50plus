name: PR checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          required = [
              Path('index.html'),
              Path('activities.html'),
              Path('listings.html'),
              Path('guides.html'),
              Path('about.html'),
              Path('contact.html'),
              Path('site-info.html'),
              Path('privacy-policy.html'),
              Path('learning.html'),
              Path('volunteering.html'),
              Path('sports.html'),
              Path('culture-library.html'),
              Path('assets/styles.css'),
              Path('assets/main.js'),
              Path('data/verified-listings.json'),
              Path('scripts/render_listings.py'),
              Path('PROJECT_SPEC.md'),
              Path('COUNCIL.md'),
              Path('.github/autopilot-policy.json'),
              Path('scripts/autopilot_status.py'),
              Path('.github/workflows/autopilot-watch.yml'),
              Path('.github/ISSUE_TEMPLATE/autopilot-task.yml'),
          ]

          missing = [str(p) for p in required if not p.exists()]
          if missing:
              print('Missing required files:', ', '.join(missing))
              sys.exit(1)

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in {'a', 'link', 'script'}:
                      value = attrs.get('href') or attrs.get('src')
                      if value:
                          self.links.append(value)

          errors = []
          html_files = sorted(Path('.').glob('*.html'))
          for html_file in html_files:
              parser = LinkParser()
              parser.feed(html_file.read_text(encoding='utf-8'))
              for link in parser.links:
                  if link.startswith(('#', 'mailto:', 'tel:', 'javascript:')):
                      continue
                  parsed = urlsplit(link)
                  if parsed.scheme or parsed.netloc:
                      continue
                  target = parsed.path
                  if not target or target == '/':
                      continue
                  target_path = (html_file.parent / target).resolve()
                  try:
                      target_path.relative_to(Path('.').resolve())
                  except ValueError:
                      errors.append(f'{html_file}: local link escapes repository: {link}')
                      continue
                  if not target_path.exists():
                      errors.append(f'{html_file}: missing local target: {link}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'Checked {len(html_files)} HTML files; required files and local links are valid.')
          PY

      - name: Validate verified listings JSON
        run: |
          python3 - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          path = Path('data/verified-listings.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          errors = []
          today = date.today()
          valid_topics = {'learning', 'volunteering', 'sports', 'culture'}

          if data.get('schema_version') != 1:
              errors.append('schema_version must be 1')

          items = data.get('items')
          if not isinstance(items, list) or not items:
              errors.append('items must be a non-empty list')
              items = []

          seen_ids = set()
          for index, item in enumerate(items, start=1):
              prefix = f'item {index}'
              for key in ('id', 'kind', 'name', 'category', 'area', 'summary', 'source_urls', 'verified_at'):
                  if not item.get(key):
                      errors.append(f'{prefix}: missing {key}')

              item_id = item.get('id')
              if item_id in seen_ids:
                  errors.append(f'{prefix}: duplicate id {item_id}')
              seen_ids.add(item_id)

              if item.get('kind') not in {'resource', 'event'}:
                  errors.append(f'{prefix}: kind must be resource or event')

              topics = item.get('topics')
              if not isinstance(topics, list) or not topics:
                  errors.append(f'{prefix}: topics must be a non-empty list')
              else:
                  invalid_topics = sorted(set(topics) - valid_topics)
                  if invalid_topics:
                      errors.append(f'{prefix}: invalid topics {invalid_topics}; must be one of {sorted(valid_topics)}')

              urls = item.get('source_urls', [])
              if not isinstance(urls, list) or not urls:
                  errors.append(f'{prefix}: source_urls must be a non-empty list')
              else:
                  for url in urls:
                      parsed = urlsplit(url)
                      if parsed.scheme != 'https' or not parsed.netloc:
                          errors.append(f'{prefix}: source URL must be https: {url}')

              verified_at = item.get('verified_at')
              try:
                  verified_date = date.fromisoformat(verified_at)
                  if verified_date > today:
                      errors.append(f'{prefix}: verified_at cannot be in the future')
              except (TypeError, ValueError):
                  errors.append(f'{prefix}: verified_at must be YYYY-MM-DD')

              if item.get('kind') == 'event':
                  if not item.get('schedule'):
                      errors.append(f'{prefix}: event must include schedule')

                  start_raw = item.get('start_date')
                  end_raw = item.get('end_date')
                  if not start_raw:
                      errors.append(f'{prefix}: event must include start_date')
                  if not end_raw:
                      errors.append(f'{prefix}: event must include end_date')

                  start_date = None
                  end_date = None
                  if start_raw:
                      try:
                          start_date = date.fromisoformat(start_raw)
                      except (TypeError, ValueError):
                          errors.append(f'{prefix}: start_date must be YYYY-MM-DD')
                  if end_raw:
                      try:
                          end_date = date.fromisoformat(end_raw)
                      except (TypeError, ValueError):
                          errors.append(f'{prefix}: end_date must be YYYY-MM-DD')

                  if start_date and end_date:
                      if start_date > end_date:
                          errors.append(f'{prefix}: start_date cannot be after end_date')
                      if end_date < today:
                          errors.append(
                              f'{prefix}: verified event ended on {end_date.isoformat()}; '
                              'review, remove, or reclassify it before publishing'
                          )

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'Validated {len(items)} verified listing records; no verified event is expired.')
          PY

      - name: Verify listings HTML is generated from JSON
        run: python3 scripts/render_listings.py --check

      - name: Validate autopilot policy JSON
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path('.github/autopilot-policy.json')
          try:
              policy = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              print(f'{path} is missing or not valid JSON: {exc}')
              sys.exit(1)

          errors = []
          required_top_level = [
              'states', 'terminal_states', 'unfinished_pr_states', 'status_labels',
              'risk_labels', 'priority_labels', 'priority_order', 'resume_precedence',
              'retry_limit', 'stale_ttl_hours', 'human_only_path_patterns',
              'risk_elevating_path_patterns', 'human_only_escalation_conditions',
              'auto_merge_allowed', 'llm_calls_in_scheduled_workflow_allowed',
          ]
          for key in required_top_level:
              if key not in policy:
                  errors.append(f'missing required key: {key}')

          if policy.get('auto_merge_allowed') is not False:
              errors.append('auto_merge_allowed must be false')
          if policy.get('llm_calls_in_scheduled_workflow_allowed') is not False:
              errors.append('llm_calls_in_scheduled_workflow_allowed must be false')

          # human_only_path_patterns must stay narrow: ordinary workflow/robots/sitemap
          # paths belong in risk_elevating_path_patterns, not here, per COUNCIL.md.
          human_only = policy.get('human_only_path_patterns', [])
          for guard_pattern in ('.github/workflows/*', 'robots.txt', 'sitemap.xml'):
              if guard_pattern in human_only:
                  errors.append(
                      f"'{guard_pattern}' must not be in human_only_path_patterns; "
                      "ordinary workflow/SEO changes are risk-elevating, not human-only"
                  )

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('autopilot-policy.json is structurally valid and consistent with COUNCIL.md.')
          PY

      - name: Run autopilot status self-test
        run: python3 scripts/autopilot_status.py --self-test

      - name: Verify autopilot watcher invokes status resolver and has no second decision engine
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path('.github/workflows/autopilot-watch.yml')
          text = path.read_text(encoding='utf-8')

          required = [
              (r'python3\s+scripts/autopilot_snapshot\.py', 'must build its input via scripts/autopilot_snapshot.py'),
              (r'python3\s+scripts/autopilot_status\.py', 'must invoke scripts/autopilot_status.py'),
              (r'GITHUB_STEP_SUMMARY', 'must write its result to GITHUB_STEP_SUMMARY'),
              (r'next-action\.json', 'its actuator step must read the resolver output file (next-action.json)'),
          ]
          errors = [f'{path}: {msg}' for pattern, msg in required if not re.search(pattern, text)]

          # scripts/autopilot_status.py (and the snapshot builder) must be the ONLY
          # duplicate/stale decision engine. These identifiers are unique to that
          # inline detection logic; their presence here means the workflow is
          # re-deriving the decision instead of only actuating the resolver's output.
          forbidden = [
              r'detect_duplicate',
              r'detect_stale',
              r'stale_ttl_hours',
              r'age_hours',
              r'closing_re',
              r'by_issue\b',
              r'active_labels\s*=',
              r'datetime\.now\(',
              r'parse_time\(',
          ]
          errors += [
              f'{path}: forbidden pattern {pattern!r} found; watcher must not re-implement '
              'duplicate/stale decision logic, only actuate scripts/autopilot_status.py output'
              for pattern in forbidden if re.search(pattern, text)
          ]

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('autopilot-watch.yml statically invokes the snapshot + status resolver scripts '
                'and contains no second duplicate/stale decision implementation.')
          PY

      - name: Reject common secret patterns in tracked source
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(BEGIN (RSA |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' .; then
            echo 'Potential secret pattern found.'
            exit 1
          fi
          echo 'No common secret patterns found.'
